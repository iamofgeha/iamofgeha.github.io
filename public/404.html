<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Ofgeha Gelana</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="dark light" />
    <style>
      :root {
        --bg: #0b0c0e;
        --fg: #f2f1ec;
        --muted: #a0a1a6;
        --line: rgb(255 255 255 / 0.16);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f7f6f3;
          --fg: #111215;
          --muted: #52545c;
          --line: rgb(15 16 20 / 0.2);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--fg);
        font-family: Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 32rem; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.8rem; color: var(--muted); }
      h1 { margin: 0.75rem 0 0; font-size: 1.75rem; letter-spacing: -0.02em; }
      p { margin: 0.75rem 0 0; color: var(--muted); line-height: 1.6; }
      .links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 2rem; }
      a {
        display: inline-flex;
        align-items: center;
        height: 44px;
        padding: 0 20px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--fg);
        text-decoration: none;
        font-size: 0.875rem;
        font-weight: 500;
      }
      a.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
      a:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="code">404</div>
      <h1>This page doesn’t exist.</h1>
      <p>The link may be old or mistyped. Everything on this site lives on a single page.</p>
      <div class="links">
        <a class="primary" href="/">Back to the portfolio</a>
        <a href="/#work">See projects</a>
        <a href="/#contact">Contact</a>
      </div>
    </main>
  </body>
</html>
